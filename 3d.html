<!-- 3D 실험실 (3d.html) -->
<!-- ========================= -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 실험실</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI', sans-serif;
    }

    body{
      background:#020617;
      color:white;
      min-height:100vh;
      overflow-x:hidden;
    }

    .bg{
      position:fixed;
      width:100%;
      height:100%;
      background:
      radial-gradient(circle at top right,#172554 0%,transparent 30%),
      radial-gradient(circle at bottom left,#0ea5e9 0%,transparent 30%);
      z-index:-1;
    }

    .container{
      width:90%;
      max-width:1200px;
      margin:auto;
      padding:60px 0;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:50px;
    }

    .title{
      font-size:3rem;
      font-weight:700;
    }

    .back{
      padding:12px 20px;
      border:none;
      border-radius:14px;
      background:#0ea5e9;
      color:white;
      cursor:pointer;
      transition:0.2s;
    }

    .back:hover{
      background:#38bdf8;
    }

    .subtitle{
      color:#cbd5e1;
      margin-bottom:40px;
      font-size:1rem;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:25px;
    }

    .card{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px;
      padding:35px 25px;
      backdrop-filter:blur(10px);
      transition:0.25s;
      cursor:pointer;
    }

    .card:hover{
      transform:translateY(-6px) scale(1.01);
      border-color:#38bdf8;
      box-shadow:0 0 25px rgba(14,165,233,0.3);
    }

    .icon{
      font-size:3rem;
      margin-bottom:18px;
    }

    .card h2{
      margin-bottom:10px;
      font-size:1.5rem;
    }

    .card p{
      color:#cbd5e1;
      line-height:1.5;
      font-size:0.95rem;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <div class="topbar">
    <div class="title">3D 실험실</div>

    <button class="back" onclick="location.href='index.html'">
      뒤로가기
    </button>
  </div>

  <div class="subtitle">
    입체 실험 환경을 선택하세요
  </div>

  <div class="grid">

    <div class="card">
      <div class="icon">🪐</div>
      <h2>중력 시뮬레이션</h2>
      <p>행성과 중력 상호작용 체험</p>
    </div>

    <div class="card">
      <div class="icon">⚛️</div>
      <h2>원자 구조</h2>
      <p>3D 원자 모델 탐색</p>
    </div>

    <div class="card">
      <div class="icon">🧬</div>
      <h2>DNA 모델</h2>
      <p>이중 나선 구조 관찰</p>
    </div>

    <div class="card">
      <div class="icon">🌋</div>
      <h2>화산 활동</h2>
      <p>지형과 분출 과정 시뮬레이션</p>
    </div>

  </div>
</div>

</body>
</html>
