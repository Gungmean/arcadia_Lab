<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>가상 실험실 (Virtual Science Lab)</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Pretendard', 'Segoe UI', sans-serif;
    }

    body{
      width:100%;
      min-height:100vh;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      overflow-x:hidden;
    }

    .bg{
      position:fixed;
      width:100%;
      height:100%;
      background:
      radial-gradient(circle at top left,#1e293b 0%,transparent 35%),
      radial-gradient(circle at bottom right,#2563eb 0%,transparent 30%);
      opacity:0.9;
      z-index:-1;
    }

    .header-bar {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 10;
    }

    .feedback-btn {
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .feedback-btn:hover {
      background: rgba(59, 130, 246, 0.8);
      border-color: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .container{
      position:relative;
      z-index:1;
      text-align:center;
      width:90%;
      max-width:900px;
      padding: 40px 0;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .title{
      font-size:3.5rem;
      font-weight:800;
      margin-bottom:12px;
      letter-spacing:-1px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle{
      color:#94a3b8;
      font-size:1.1rem;
      margin-bottom:50px;
      line-height: 1.6;
    }

    .menu{
      display:flex;
      gap:28px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .card{
      width:300px;
      height:220px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      border-radius:24px;
      padding: 24px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      cursor:pointer;
      transition:all 0.25s ease;
      position: relative;
    }

    .card:hover{
      transform:translateY(-8px) scale(1.02);
      background:rgba(255,255,255,0.08);
      border-color:#3b82f6;
      box-shadow:0 12px 35px rgba(59,130,246,0.3);
    }

    .icon{
      font-size:3.5rem;
      margin-bottom:15px;
    }

    .card h2{
      font-size:1.6rem;
      font-weight:700;
      margin-bottom:8px;
    }

    .card p{
      color:#94a3b8;
      font-size:0.95rem;
    }

    .card-tag {
      position: absolute;
      bottom: 14px;
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 600;
    }

    @media(max-width:700px){
      .title{
        font-size:2.5rem;
      }
      .menu{
        flex-direction:column;
        align-items:center;
      }
      .card {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="header-bar">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdRpS65k_rRiENkOXQtqERFZpdIhjpSssaQSaVSrIKf-ynJyw/viewform?usp=header" target="_blank" class="feedback-btn">
      💬 평가 및 피드백 남기기 ↗
    </a>
  </div>

  <div class="container">
    <div class="badge">ARCADIA · VIRTUAL LAB</div>

    <div class="title">인터랙티브 가상 실험실</div>

    <div class="subtitle">
      2022 개정 교육과정 기반 과학 개념을 직접 조작하고 시각적으로 관찰해보세요.
    </div>

    <div class="menu">

      <!-- 2D 실험실 연결 -->
      <div class="card" onclick="location.href='2d.html'">
        <div class="icon">🧪</div>
        <h2>2D 실험실</h2>
        <p>물·화·생·지 인터랙티브 시뮬레이션</p>
        <span class="card-tag">8개 실험 탐색하기 →</span>
      </div>

      <!-- 3D 실험실 연결 -->
      <div class="card" onclick="location.href='3d.html'">
        <div class="icon">🧬</div>
        <h2>3D 실험실</h2>
        <p>입체 가상 공간 및 모델 탐색</p>
        <span class="card-tag">준비 중 →</span>
      </div>

    </div>
  </div>

</body>
</html>
