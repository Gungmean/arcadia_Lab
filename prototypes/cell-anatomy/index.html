<p class="source-line">구조와 기능: <a href="https://openstax.org/books/biology-2e/pages/4-3-eukaryotic-cells" target="_blank" rel="noopener noreferrer">OpenStax Biology 2e · Eukaryotic Cells</a></p></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}

const entries={"animal":{"membrane":["세포막","경계와 선택적 이동","인지질 이중층과 막단백질이 세포 안팎을 구분합니다. 필요한 물질의 이동과 신호 전달을 조절합니다.","가장 바깥의 연속된 경계를 따라가 보세요."],"phospholipid":["인지질 이중층","친수성 머리와 소수성 꼬리","인지질은 물과 닿는 친수성 머리를 바깥으로, 소수성 꼬리를 안쪽으로 향하게 배열합니다. 이중층은 세포막의 기본 골격입니다.","세포막 가장자리에 나란히 반복되는 작은 입자입니다."],"cytoplasm":["세포질","반응이 일어나는 공간","세포질에는 세포질액과 소기관이 포함됩니다. 여러 대사 반응이 이 공간에서 진행됩니다.","소기관 사이를 채우는 옅은 바탕입니다."],"nucleus":["핵","유전 정보의 보관","핵은 DNA를 담고 있습니다. 핵 안에서 전사가 일어나며, 핵막의 통로를 통해 물질이 오갑니다.","겹막과 핵공을 둘러싼 큰 원형 구조입니다."],"nuclearEnvelope":["핵막","핵과 세포질 사이의 이중막","핵막은 안팎의 두 막으로 이뤄지고, 바깥막은 소포체 막과 이어집니다. 핵공 복합체가 두 막을 관통합니다.","핵 가장자리의 나란한 두 겹 선을 따라가 보세요."],"nuclearPore":["핵공","핵과 세포질 사이의 선택적 수송","핵공 복합체는 단백질과 RNA의 출입을 조절합니다. 작은 분자는 확산할 수 있고, 큰 분자는 운반 단백질의 도움을 받습니다.","핵막 가장자리에 반복되는 작은 고리입니다."],"nucleolus":["인","리보솜 부품의 조립","인에서는 리보솜 RNA가 만들어지고 리보솜 소단위체가 조립됩니다. 막으로 둘러싸인 소기관은 아닙니다.","핵 안쪽의 진한 작은 원을 누르세요."],"chromatin":["염색질","DNA와 단백질","DNA가 히스톤 등 단백질과 결합한 상태입니다. 세포 분열 때 응축되어 염색체로 뚜렷하게 보입니다.","핵 내부의 가느다란 실 같은 무늬입니다."],"roughER":["거친면 소포체","분비 단백질의 합성·가공","표면에 붙은 리보솜이 분비되거나 막에 들어갈 단백질을 합성합니다. 소포체 내부에서 접힘과 초기 가공이 이어집니다.","핵 곁의 층진 막에 작은 점들이 붙어 있습니다."],"smoothER":["매끈면 소포체","지질 합성과 해독","리보솜이 붙지 않은 소포체 영역입니다. 지질 합성, 해독, 칼슘 이온 저장 등에 관여합니다.","작은 점이 없는 구불구불한 막 관입니다."],"ribosome":["리보솜","단백질 합성","mRNA의 정보를 읽어 아미노산을 연결합니다. 세포질에 자유롭게 있거나 거친면 소포체에 붙어 있습니다.","흩어진 작은 점과 소포체 표면의 점을 보세요."],"golgi":["골지체","분류와 포장","소포체에서 온 단백질과 지질을 변형·분류하고 목적지에 맞게 소낭으로 포장합니다.","나란히 휘어진 납작한 막 주머니입니다."],"mitochondrion":["미토콘드리아","세포 호흡과 ATP 생성","내막의 주름인 크리스타를 가진 이중막 소기관입니다. 세포 호흡의 여러 단계에 관여해 ATP를 만듭니다.","타원 안에 접힌 안쪽 막을 살펴보세요."],"cristae":["크리스타","미토콘드리아 내막의 주름","내막이 접혀 표면적을 넓힙니다. 전자 전달계와 ATP 합성효소가 내막에 있어 산화적 인산화가 일어납니다.","미토콘드리아 안쪽의 촘촘한 주름을 누르세요."],"lysosome":["리소좀","분해와 재활용","산성 내부의 가수분해 효소가 큰 분자와 낡은 세포 구성 요소를 분해합니다.","작고 짙은 구형 소낭입니다."],"peroxisome":["퍼옥시좀","산화 반응과 과산화수소 처리","일부 지방산을 분해하고 산화 반응에서 생긴 과산화수소를 카탈레이스로 처리합니다.","리소좀과 구별되는 노란 작은 소낭입니다."],"centrosome":["중심체","미세소관 조직","동물세포의 중심체는 미세소관을 조직합니다. 보통 서로 직각으로 놓인 중심립 한 쌍을 포함합니다.","짧은 원통 두 개가 엇갈린 곳입니다."],"vesicle":["수송 소낭","물질의 운반","막으로 싸인 작은 주머니가 소포체·골지체·세포막 사이에서 화물을 옮깁니다.","골지체 주변의 작은 막 구슬입니다."],"cytoskeleton":["세포 골격","형태 유지와 세포 내 이동","미세소관·미세섬유 등으로 이뤄진 동적인 그물입니다. 형태 유지와 세포 내 물질 이동에 관여합니다.","세포 내부를 지나는 가느다란 섬유입니다."]},"plant":{"wall":["세포벽","지지와 보호","주로 셀룰로스로 이뤄진 단단한 층으로, 세포막 바깥에 있습니다. 세포의 모양과 기계적 지지를 제공합니다.","가장 바깥쪽의 두꺼운 사각 경계입니다."],"membrane":["세포막","선택적 물질 이동","세포벽 바로 안쪽의 인지질 이중층입니다. 물질 이동과 신호 인식을 조절합니다.","세포벽 안쪽의 가는 연속선입니다."],"phospholipid":["인지질 이중층","친수성 머리와 소수성 꼬리","인지질은 친수성 머리를 물이 있는 양쪽으로, 소수성 꼬리를 서로 마주 보게 배열합니다.","세포막 가장자리에 나란히 반복되는 작은 입자입니다."],"cytoplasm":["세포질","소기관이 놓이는 공간","세포질액과 소기관을 포함합니다. 큰 중앙 액포 때문에 성숙한 식물세포에서는 가장자리의 얇은 띠처럼 보이기도 합니다.","액포와 세포막 사이의 바탕을 보세요."],"nucleus":["핵","유전 정보의 보관","DNA가 들어 있고 유전자 발현을 조절하는 핵심 공간입니다. 핵막은 소포체와 이어집니다.","액포 옆으로 밀려난 큰 둥근 구조입니다."],"nuclearEnvelope":["핵막","핵과 세포질 사이의 이중막","안팎의 막이 핵을 감싸며 바깥막은 소포체와 이어집니다. 핵공 복합체가 핵과 세포질 사이의 수송을 조절합니다.","핵 가장자리의 나란한 두 겹 선을 따라가 보세요."],"nuclearPore":["핵공","핵과 세포질 사이의 선택적 수송","핵공 복합체는 RNA와 단백질의 출입을 조절합니다.","핵막 가장자리의 작은 고리를 찾으세요."],"nucleolus":["인","리보솜 소단위체 조립","리보솜 RNA와 단백질을 이용해 리보솜 소단위체를 조립합니다.","핵 안의 진한 작은 원입니다."],"roughER":["거친면 소포체","단백질 합성과 초기 가공","표면의 리보솜에서 분비·막 단백질을 합성합니다. 막 공간에서 단백질의 접힘과 초기 가공이 일어납니다.","핵 주변의 점이 붙은 층진 막입니다."],"ribosome":["리보솜","단백질 합성","자유 리보솜과 거친면 소포체에 붙은 리보솜이 모두 단백질을 만듭니다.","세포질과 막 표면의 작은 점입니다."],"golgi":["골지체","변형·분류·운반","단백질과 지질을 처리해 소낭으로 보냅니다. 식물세포에서는 세포벽 다당류의 합성에도 관여합니다.","겹쳐진 굽은 막 주머니입니다."],"mitochondrion":["미토콘드리아","ATP 생성","식물세포도 세포 호흡을 합니다. 미토콘드리아는 유기물의 에너지를 ATP 형태로 전환하는 과정에 관여합니다.","안쪽 막이 접힌 타원입니다."],"cristae":["크리스타","미토콘드리아 내막의 주름","내막 표면을 넓혀 전자 전달과 ATP 합성에 관여합니다. 식물세포에도 미토콘드리아가 있습니다.","미토콘드리아 내부의 접힌 선을 누르세요."],"chloroplast":["엽록체","광합성","엽록소가 든 틸라코이드 막에서 빛 에너지를 이용하고, 스트로마에서 탄소 고정 반응이 진행됩니다.","초록 타원 두 개를 보세요."],"grana":["그라나·틸라코이드","빛 반응이 일어나는 막","틸라코이드는 납작한 막 주머니이며, 여러 개가 쌓인 구조가 그라나입니다. 빛 반응의 단백질 복합체가 막에 있습니다.","엽록체 안의 짧은 원반 더미를 누르세요."],"stromaLamella":["스트로마 라멜라","그라나를 잇는 틸라코이드 막","스트로마 라멜라는 서로 다른 그라나를 연결하는 틸라코이드 막입니다. 틸라코이드 내부 공간은 막을 사이에 두고 스트로마와 구분됩니다.","그라나 사이를 잇는 가는 막을 따라가 보세요."],"cellulose":["셀룰로스 미세섬유","세포벽의 인장 강도","셀룰로스 미세섬유는 세포벽의 다당류 기질에 놓여 벽의 기계적 성질을 만듭니다. 배열 방향과 벽의 층에 따라 성장 방향이 달라질 수 있습니다.","세포벽 가장자리의 교차 섬유 무늬입니다."],"vacuole":["중앙 액포","저장과 팽압 유지","물·이온·색소·노폐물 등을 저장할 수 있습니다. 물이 차 팽압을 만들면 세포벽과 함께 세포 형태를 지탱합니다.","세포 중심을 크게 차지하는 연푸른 공간입니다."],"tonoplast":["액포막","액포와 세포질의 경계","중앙 액포를 둘러싼 막으로, 물질의 출입을 조절해 액포 내부 조성을 유지합니다.","큰 액포의 가장자리를 따라가 보세요."],"plasmodesmata":["원형질 연락사","이웃 세포와의 통로","인접한 식물세포의 세포질을 잇는 통로로, 물질과 신호가 세포 사이를 이동할 수 있습니다.","세포벽을 가로지르는 짧은 통로입니다."],"peroxisome":["퍼옥시좀","산화 반응","지방산 분해 등 산화 반응에 관여하며, 생긴 과산화수소를 처리합니다.","작은 노란 소낭입니다."]}};
const root=document.body;
const figure=document.querySelector('.cell-stage svg');
const zoom=document.querySelector('[data-organ-zoom]');
const zoomSlot=zoom.querySelector('[data-zoom-slot]');
const readout=document.querySelector('[data-readout]');
let mode='animal', selected='nucleus';
function updateZoom(key){
  const source=figure.querySelector('.organelle[data-mode="'+mode+'"][data-key="'+key+'"]');
  if(!source)return;
  const box=source.getBBox(),pad=Math.max(5,Math.max(box.width,box.height)*.2);
  zoom.setAttribute('viewBox',[box.x-pad,box.y-pad,Math.max(1,box.width+pad*2),Math.max(1,box.height+pad*2)].join(' '));
  zoom.setAttribute('aria-label',entries[mode][key][0]+' 확대 그림');
  document.querySelector('[data-zoom-name]').textContent=entries[mode][key][0];
  const copy=source.cloneNode(true);copy.classList.add('zoom-organelle');copy.dataset.selected='true';copy.removeAttribute('tabindex');copy.removeAttribute('role');
  for(const prop of ['--anatomy-paper','--anatomy-face','--anatomy-top','--anatomy-shade-0','--anatomy-shade-1','--anatomy-shade-2','--anatomy-shade-3','--anatomy-lit-top','--anatomy-lit-shade','--anatomy-hi','--anatomy-mid','--anatomy-lo','--anatomy-faint'])copy.style.setProperty(prop,getComputedStyle(source).getPropertyValue(prop));
  zoomSlot.replaceChildren(copy);
}
function select(key){
  if(!entries[mode][key])return;
  selected=key;
  const [name,role,detail,observe]=entries[mode][key];
  document.querySelector('[data-name]').textContent=name;
  document.querySelector('[data-role]').textContent=role;
  document.querySelector('[data-detail]').textContent=detail;
  document.querySelector('[data-observe]').textContent=observe;
  document.querySelector('[data-mode-label]').textContent=(mode==='animal'?'동물세포':'식물세포')+' / '+name;
  readout.textContent=(mode==='animal'?'동물세포':'식물세포')+' · '+name;
  figure.querySelectorAll('.organelle').forEach(el=>el.dataset.selected=String(el.dataset.mode===mode&&el.dataset.key===key));
  document.querySelectorAll('[data-select]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode&&el.dataset.select===key)));
  updateZoom(key);
}
function switchMode(next){
  if(!entries[next])return;
  mode=next;root.dataset.cell=next;
  document.querySelectorAll('[data-switch]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.switch===next)));
  figure.setAttribute('aria-label',(next==='animal'?'동물세포':'식물세포')+' 구조를 선택하여 탐색하는 모식도');
  select('nucleus');
}
document.querySelectorAll('[data-switch]').forEach(el=>el.addEventListener('click',()=>switchMode(el.dataset.switch)));
document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.select)));
figure.addEventListener('click',event=>{const parts=[...new Set(document.elementsFromPoint(event.clientX,event.clientY).map(node=>node.closest?.('.organelle')).filter(el=>el&&el.dataset.mode===mode))];parts.sort((a,b)=>{const A=a.getBBox(),B=b.getBBox();return A.width*A.height-B.width*B.height});if(parts[0])select(parts[0].dataset.key)});
figure.addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;const item=event.target.closest('.organelle');if(item&&item.dataset.mode===mode){event.preventDefault();select(item.dataset.key)}});
switchMode('animal');
</script></body></html>
