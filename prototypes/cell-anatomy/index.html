<p class="source-line">구조와 기능: <a href="https://openstax.org/books/biology-2e/pages/4-3-eukaryotic-cells" target="_blank" rel="noopener noreferrer">OpenStax Biology 2e · Eukaryotic Cells</a></p></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;

}

.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}

.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}

.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}

.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

const entries={"animal":{"membrane":["세포막","경계와 선택적 이동","인지질 이중층과 막단백질이 세포 안팎을 구분합니다. 필요한 물질의 이동과 신호 전달을 조절합니다.","가장 바깥의 연속된 경계를 따라가 보세요."],"cytoplasm":["세포질","반응이 일어나는 공간","세포질에는 세포질액과 소기관이 포함됩니다. 여러 대사 반응이 이 공간에서 진행됩니다.","소기관 사이를 채우는 옅은 바탕입니다."],"nucleus":["핵","유전 정보의 보관","핵은 DNA를 담고 있습니다. 핵 안에서 전사가 일어나며, 핵막의 통로를 통해 물질이 오갑니다.","겹막과 핵공을 둘러싼 큰 원형 구조입니다."],"nucleolus":["인","리보솜 부품의 조립","인에서는 리보솜 RNA가 만들어지고 리보솜 소단위체가 조립됩니다. 막으로 둘러싸인 소기관은 아닙니다.","핵 안쪽의 진한 작은 원을 누르세요."],"chromatin":["염색질","DNA와 단백질","DNA가 히스톤 등 단백질과 결합한 상태입니다. 세포 분열 때 응축되어 염색체로 뚜렷하게 보입니다.","핵 내부의 가느다란 실 같은 무늬입니다."],"roughER":["거친면 소포체","분비 단백질의 합성·가공","표면에 붙은 리보솜이 분비되거나 막에 들어갈 단백질을 합성합니다. 소포체 내부에서 접힘과 초기 가공이 이어집니다.","핵 곁의 층진 막에 작은 점들이 붙어 있습니다."],"smoothER":["매끈면 소포체","지질 합성과 해독","리보솜이 붙지 않은 소포체 영역입니다. 지질 합성, 해독, 칼슘 이온 저장 등에 관여합니다.","작은 점이 없는 구불구불한 막 관입니다."],"ribosome":["리보솜","단백질 합성","mRNA의 정보를 읽어 아미노산을 연결합니다. 세포질에 자유롭게 있거나 거친면 소포체에 붙어 있습니다.","흩어진 작은 점과 소포체 표면의 점을 보세요."],"golgi":["골지체","분류와 포장","소포체에서 온 단백질과 지질을 변형·분류하고 목적지에 맞게 소낭으로 포장합니다.","나란히 휘어진 납작한 막 주머니입니다."],"mitochondrion":["미토콘드리아","세포 호흡과 ATP 생성","내막의 주름인 크리스타를 가진 이중막 소기관입니다. 세포 호흡의 여러 단계에 관여해 ATP를 만듭니다.","타원 안에 접힌 안쪽 막을 살펴보세요."],"lysosome":["리소좀","분해와 재활용","산성 내부의 가수분해 효소가 큰 분자와 낡은 세포 구성 요소를 분해합니다.","작고 짙은 구형 소낭입니다."],"peroxisome":["퍼옥시좀","산화 반응과 과산화수소 처리","일부 지방산을 분해하고 산화 반응에서 생긴 과산화수소를 카탈레이스로 처리합니다.","리소좀과 구별되는 노란 작은 소낭입니다."],"centrosome":["중심체","미세소관 조직","동물세포의 중심체는 미세소관을 조직합니다. 보통 서로 직각으로 놓인 중심립 한 쌍을 포함합니다.","짧은 원통 두 개가 엇갈린 곳입니다."],"vesicle":["수송 소낭","물질의 운반","막으로 싸인 작은 주머니가 소포체·골지체·세포막 사이에서 화물을 옮깁니다.","골지체 주변의 작은 막 구슬입니다."],"cytoskeleton":["세포 골격","형태 유지와 세포 내 이동","미세소관·미세섬유 등으로 이뤄진 동적인 그물입니다. 형태 유지와 세포 내 물질 이동에 관여합니다.","세포 내부를 지나는 가느다란 섬유입니다."]},"plant":{"wall":["세포벽","지지와 보호","주로 셀룰로스로 이뤄진 단단한 층으로, 세포막 바깥에 있습니다. 세포의 모양과 기계적 지지를 제공합니다.","가장 바깥쪽의 두꺼운 사각 경계입니다."],"membrane":["세포막","선택적 물질 이동","세포벽 바로 안쪽의 인지질 이중층입니다. 물질 이동과 신호 인식을 조절합니다.","세포벽 안쪽의 가는 연속선입니다."],"cytoplasm":["세포질","소기관이 놓이는 공간","세포질액과 소기관을 포함합니다. 큰 중앙 액포 때문에 성숙한 식물세포에서는 가장자리의 얇은 띠처럼 보이기도 합니다.","액포와 세포막 사이의 바탕을 보세요."],"nucleus":["핵","유전 정보의 보관","DNA가 들어 있고 유전자 발현을 조절하는 핵심 공간입니다. 핵막은 소포체와 이어집니다.","액포 옆으로 밀려난 큰 둥근 구조입니다."],"nucleolus":["인","리보솜 소단위체 조립","리보솜 RNA와 단백질을 이용해 리보솜 소단위체를 조립합니다.","핵 안의 진한 작은 원입니다."],"roughER":["거친면 소포체","단백질 합성과 초기 가공","표면의 리보솜에서 분비·막 단백질을 합성합니다. 막 공간에서 단백질의 접힘과 초기 가공이 일어납니다.","핵 주변의 점이 붙은 층진 막입니다."],"ribosome":["리보솜","단백질 합성","자유 리보솜과 거친면 소포체에 붙은 리보솜이 모두 단백질을 만듭니다.","세포질과 막 표면의 작은 점입니다."],"golgi":["골지체","변형·분류·운반","단백질과 지질을 처리해 소낭으로 보냅니다. 식물세포에서는 세포벽 다당류의 합성에도 관여합니다.","겹쳐진 굽은 막 주머니입니다."],"mitochondrion":["미토콘드리아","ATP 생성","식물세포도 세포 호흡을 합니다. 미토콘드리아는 유기물의 에너지를 ATP 형태로 전환하는 과정에 관여합니다.","안쪽 막이 접힌 타원입니다."],"chloroplast":["엽록체","광합성","엽록소가 든 틸라코이드 막에서 빛 에너지를 이용하고, 스트로마에서 탄소 고정 반응이 진행됩니다.","초록 타원 두 개를 보세요."],"grana":["그라나·틸라코이드","빛 반응이 일어나는 막","틸라코이드는 납작한 막 주머니이며, 여러 개가 쌓인 구조가 그라나입니다. 빛 반응의 단백질 복합체가 막에 있습니다.","엽록체 안의 짧은 원반 더미를 누르세요."],"vacuole":["중앙 액포","저장과 팽압 유지","물·이온·색소·노폐물 등을 저장할 수 있습니다. 물이 차 팽압을 만들면 세포벽과 함께 세포 형태를 지탱합니다.","세포 중심을 크게 차지하는 연푸른 공간입니다."],"tonoplast":["액포막","액포와 세포질의 경계","중앙 액포를 둘러싼 막으로, 물질의 출입을 조절해 액포 내부 조성을 유지합니다.","큰 액포의 가장자리를 따라가 보세요."],"plasmodesmata":["원형질 연락사","이웃 세포와의 통로","인접한 식물세포의 세포질을 잇는 통로로, 물질과 신호가 세포 사이를 이동할 수 있습니다.","세포벽을 가로지르는 짧은 통로입니다."],"peroxisome":["퍼옥시좀","산화 반응","지방산 분해 등 산화 반응에 관여하며, 생긴 과산화수소를 처리합니다.","작은 노란 소낭입니다."]}};
const root=document.body;
const figure=document.querySelector('.cell-stage svg');
const readout=document.querySelector('[data-readout]');
let mode='animal', selected='nucleus';
function select(key){
  if(!entries[mode][key])return;
  selected=key;
  const [name,role,detail,observe]=entries[mode][key];
  document.querySelector('[data-name]').textContent=name;
  document.querySelector('[data-role]').textContent=role;
  document.querySelector('[data-detail]').textContent=detail;
  document.querySelector('[data-observe]').textContent=observe;
  document.querySelector('[data-mode-label]').textContent=(mode==='animal'?'동물세포':'식물세포')+' / '+name;
  readout.textContent=(mode==='animal'?'동물세포':'식물세포')+' · '+name;
  figure.querySelectorAll('.organelle').forEach(el=>el.dataset.selected=String(el.dataset.mode===mode&&el.dataset.key===key));
  document.querySelectorAll('[data-select]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode&&el.dataset.select===key)));
}
function switchMode(next){
  if(!entries[next])return;
  mode=next;root.dataset.cell=next;
  document.querySelectorAll('[data-switch]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.switch===next)));
  figure.setAttribute('aria-label',(next==='animal'?'동물세포':'식물세포')+' 구조를 선택하여 탐색하는 모식도');
  select('nucleus');
}
document.querySelectorAll('[data-switch]').forEach(el=>el.addEventListener('click',()=>switchMode(el.dataset.switch)));
document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.select)));
figure.addEventListener('click',event=>{const item=event.target.closest('.organelle');if(item&&item.dataset.mode===mode)select(item.dataset.key)});
figure.addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;const item=event.target.closest('.organelle');if(item&&item.dataset.mode===mode){event.preventDefault();select(item.dataset.key)}});
switchMode('animal');
</script></body></html>
