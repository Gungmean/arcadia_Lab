<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/arcadia.css">
    <title>천체의 일주 운동 | Arcadia Lab</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030712; color: #e2e8f0; font-family: 'Gmarket Sans', sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        .panel { position: absolute; background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; border-radius: 12px; padding: 15px; box-shadow: 0 4px 20px rgba(0, 150, 255, 0.2); backdrop-filter: blur(8px); }
        h3 { margin: 0 0 12px 0; color: #38bdf8; font-size: 1.1em; border-bottom: 1px solid #334155; padding-bottom: 6px; }
        
        #controls { top: 20px; left: 20px; width: 340px; }
        .control-row { margin-bottom: 14px; background: rgba(30, 41, 59, 0.4); padding: 10px; border-radius: 8px; border: 1px solid #1e293b; }
        label { display: block; margin-bottom: 6px; font-size: 0.9em; color: #bae6fd; font-weight: bold; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #38bdf8; }
        
        .btn-group { display: flex; gap: 6px; margin-top: 6px; }
        button { flex: 1; padding: 8px; background: #334155; color: white; border: 1px solid #475569; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.85em;}
        button:hover { background: #475569; }
        button.active { background: #0ea5e9; border-color: #38bdf8; }
        
        button.toggle-play { background: #1e293b; border-color: #475569; }
        button.toggle-play.playing { background: #10b981; border-color: #059669; color: #000; }

        #observer-view-panel { top: 20px; right: 20px; width: 320px; }
        #observer-canvas { background: #020617; border: 1px solid #1e293b; border-radius: 8px; display: block; margin-top: 10px; width: 320px; height: 200px; }

        #status-panel { bottom: 20px; right: 20px; width: 320px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9em; border-bottom: 1px dashed #1e293b; padding-bottom: 4px;}
        .highlight { color: #facc15; font-weight: bold; }
        .special-case { color: #f43f5e; font-weight: bold; text-shadow: 0 0 8px rgba(244, 63, 94, 0.4); }

        #instructions { position: absolute; bottom: 20px; left: 20px; color: #94a3b8; font-size: 0.85em; pointer-events: none; line-height: 1.6; text-shadow: 0 0 5px #000; }
        .back-btn { position:absolute; z-index:20; top:20px; left:20px; padding:8px 11px; border:1px solid #475569; border-radius:6px; background:rgba(2,6,23,.78); color:#e2e8f0; font-size:.78rem; text-decoration:none; }
        @media (max-width:700px) {
            .back-btn { top:12px; left:12px; }.panel { border-radius:8px; padding:11px; }
            #controls { top:54px; left:12px; width:min(250px,calc(100vw - 24px)); max-height:calc(100svh - 70px); overflow-y:auto; }
            #observer-view-panel, #status-panel, #instructions { display:none; }
            h3 { font-size:1rem; }.control-row { padding:8px; }.btn-group button { min-height:36px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <a class="back-btn" href="../2d.html">← 실험 목록</a>
    <div id="canvas-container"></div>

    <div id="controls" class="panel">
        <h3>시뮬레이션 제어 룸</h3>
        
        <div class="control-row">
            <label>행성 타입 관측 선택</label>
            <div class="btn-group">
                <button id="btn-inner" class="active">내행성 (금성)</button>
                <button id="btn-outer">외행성 (화성)</button>
            </div>
        </div>

        <div class="control-row">
            <label>지구 자전 (관측자 시간): <span id="val-rotation" class="highlight">12:00</span> 시</label>
            <input type="range" id="slide-rotation" min="0" max="24" step="0.1" value="12">
            <div class="btn-group">
                <button id="play-rotation" class="toggle-play">지구자전 자동 재생 🔄</button>
            </div>
        </div>

        <div class="control-row">
            <label>사람 위치 (현재: <span id="val-latitude" class="highlight">90° 북극(수직 위)</span>)</label>
            <input type="range" id="slide-latitude" min="0" max="90" step="1" value="90">
            <div style="font-size:0.75em; color:#94a3b8; margin-top:4px;">* 90도(수직)에서는 태양이 지평선을 따라 돌기만 합니다. 뜨고 지는 걸 보려면 낮춰보세요.</div>
        </div>

        <div class="control-row">
            <label>행성 상대 위치 각도: <span id="val-orbit" class="highlight">45</span>°</label>
            <input type="range" id="slide-orbit" min="0" max="360" step="1" value="45">
            <div class="btn-group">
                <button id="play-orbit" class="toggle-play">상대 위치 자동 이동 🔄</button>
            </div>
            <div style="font-size:0.75em; color:#94a3b8; margin-top:6px;">* 원형·동일 평면 궤도와 춘분 조건을 가정한 기하학 모형입니다. 자동 이동은 실제 공전 주기 재현이 아닙니다.</div>
        </div>
        
        <div class="btn-group">
            <button id="btn-stop-all" style="background:#ef4444; border-color:#b91c1c;">🛑 전체 일시정지</button>
        </div>
    </div>

    <div id="observer-view-panel" class="panel">
        <h3>1인칭 시점 (방위: 동-남-서)</h3>
        <canvas id="observer-canvas" width="320" height="200"></canvas>
    </div>

    <div id="status-panel" class="panel">
        <h3>천문 기하학 정보 (단순 모형)</h3>
        <div class="stat-row"><span>관측 행성</span> <span id="txt-planet" class="highlight">금성 (Inner)</span></div>
        <div class="stat-row"><span>태양-지구-행성 사잇각</span> <span id="txt-angle">0.0°</span></div>
        <div class="stat-row"><span>이각 상태</span> <span id="txt-elongation">-</span></div>
        <div class="stat-row"><span>특수 천문 현상</span> <span id="txt-special" class="special-case">일반 위치</span></div>
    </div>


    <script>
        // --- Three.js 세팅 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 38, 0); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 조명
        scene.add(new THREE.AmbientLight(0x222222));
        const sunLight = new THREE.PointLight(0xffffff, 2.5, 500);
        scene.add(sunLight);

        // --- 천체 및 사람 오브젝트 구성 ---
        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(2.2, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
        scene.add(sunMesh);

        // 지구 그룹 생성
        const earthGroup = new THREE.Group();
        const earthOrbitRadius = 15;
        earthGroup.position.set(earthOrbitRadius, 0, 0); 
        scene.add(earthGroup);

        // [자전 체감용 지구 무늬 생성] 
        // 캔버스 텍스처를 동적으로 구워 지구에 경선/위선 격자무늬 매핑
        const gridCanvas = document.createElement('canvas');
        gridCanvas.width = 512;
        gridCanvas.height = 256;
        const gCtx = gridCanvas.getContext('2d');
        gCtx.fillStyle = '#3b82f6'; // 바탕 바다색
        gCtx.fillRect(0,0,512,256);
        gCtx.strokeStyle = '#93c5fd'; // 격자선 색상
        gCtx.lineWidth = 2;
        // 위선(가로선) 그리기
        for(let i=1; i<8; i++) {
            let y = (256/8)*i;
            gCtx.beginPath(); gCtx.moveTo(0,y); gCtx.lineTo(512,y); gCtx.stroke();
        }
        // 경선(세로선) 그리기
        for(let i=0; i<12; i++) {
            let x = (512/12)*i;
            gCtx.beginPath(); gCtx.moveTo(x,0); gCtx.lineTo(x,256); gCtx.stroke();
        }
        const earthTexture = new THREE.CanvasTexture(gridCanvas);

        const earthMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 32, 32), 
            new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.6 })
        );
        earthGroup.add(earthMesh);

        // 사람 마커 및 지평선 그룹
        const humanGroup = new THREE.Group();
        const humanMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), humanMat);
        head.position.y = 1.95; 
        humanGroup.add(head);
        
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.3, 16), humanMat);
        body.position.y = 1.75;
        humanGroup.add(body);

        const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 8), humanMat);
        legL.position.set(-0.04, 1.55, 0);
        const legR = legL.clone();
        legR.position.x = 0.04;
        humanGroup.add(legL);
        humanGroup.add(legR);

        const horizonDisk = new THREE.Mesh(
            new THREE.CircleGeometry(1.3, 32),
            new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide, transparent: true, opacity: 0.3 })
        );
        horizonDisk.position.y = 1.48; 
        horizonDisk.rotation.x = Math.PI / 2; 
        humanGroup.add(horizonDisk);

        // 남쪽(S) 나침반 바늘
        const compassNeedle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6, 8), new THREE.MeshBasicMaterial({color: 0xef4444}));
        compassNeedle.position.set(0, 1.49, 0.3);
        compassNeedle.rotation.x = Math.PI / 2;
        humanGroup.add(compassNeedle);

        earthGroup.add(humanGroup);

        const planetMesh = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4 }));
        scene.add(planetMesh);

        function createOrbitLine(radius, colorHex) {
            const points = [];
            for (let i = 0; i <= 128; i++) {
                const theta = (i / 128) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.25 });
            return new THREE.Line(geo, mat);
        }

        const earthOrbitLine = createOrbitLine(earthOrbitRadius, 0x3b82f6);
        scene.add(earthOrbitLine);

        let planetOrbitRadius = 9; 
        let planetOrbitLine = createOrbitLine(planetOrbitRadius, 0xf472b6);
        scene.add(planetOrbitLine);


        // --- 시뮬레이터 데이터 동기화 변수 ---
        let mode = 'inner';
        let rotationHour = 12;   
        let planetOrbitDeg = 45; 
        let observerLatitude = 90; 

        let playRotation = false;
        let playOrbit = false;

        const slideRotation = document.getElementById('slide-rotation');
        const slideOrbit = document.getElementById('slide-orbit');
        const slideLatitude = document.getElementById('slide-latitude');
        
        const valRotation = document.getElementById('val-rotation');
        const valOrbit = document.getElementById('val-orbit');
        const valLatitude = document.getElementById('val-latitude');

        const txtPlanet = document.getElementById('txt-planet');
        const txtAngle = document.getElementById('txt-angle');
        const txtElongation = document.getElementById('txt-elongation');
        const txtSpecial = document.getElementById('txt-special');

        const obsCanvas = document.getElementById('observer-canvas');
        const obsCtx = obsCanvas.getContext('2d');

        // --- UI 버튼 및 슬라이더 액션 바인딩 ---
        document.getElementById('btn-inner').onclick = () => {
            mode = 'inner'; planetOrbitRadius = 9;
            document.getElementById('btn-inner').className = 'active';
            document.getElementById('btn-outer').className = '';
            txtPlanet.innerText = "금성 (Inner)";
            scene.remove(planetOrbitLine);
            planetOrbitLine = createOrbitLine(planetOrbitRadius, 0xf472b6);
            scene.add(planetOrbitLine);
            updatePhysics();
        };

        document.getElementById('btn-outer').onclick = () => {
            mode = 'outer'; planetOrbitRadius = 24;
            document.getElementById('btn-inner').className = '';
            document.getElementById('btn-outer').className = 'active';
            txtPlanet.innerText = "화성 (Outer)";
            scene.remove(planetOrbitLine);
            planetOrbitLine = createOrbitLine(planetOrbitRadius, 0xfb923c);
            scene.add(planetOrbitLine);
            updatePhysics();
        };

        slideRotation.oninput = (e) => { rotationHour = parseFloat(e.target.value); updateRotationText(); updatePhysics(); };
        slideOrbit.oninput = (e) => { planetOrbitDeg = parseInt(e.target.value); valOrbit.innerText = planetOrbitDeg; updatePhysics(); };
        
        slideLatitude.oninput = (e) => { 
            observerLatitude = parseInt(e.target.value); 
            if(observerLatitude === 90) valLatitude.innerText = "90° 북극(수직 위)";
            else if(observerLatitude === 0) valLatitude.innerText = "0° 적도(옆면)";
            else valLatitude.innerText = `${observerLatitude}° (중위도)`;
            updatePhysics(); 
        };

        function setToggleStyle(btn, state) { btn.className = state ? "toggle-play playing" : "toggle-play"; btn.innerText = state ? "자동 가동 중 ⏸" : "자동 재생 🔄"; }
        document.getElementById('play-rotation').onclick = function() { playRotation = !playRotation; setToggleStyle(this, playRotation); };
        document.getElementById('play-orbit').onclick = function() { playOrbit = !playOrbit; setToggleStyle(this, playOrbit); };

        document.getElementById('btn-stop-all').onclick = function() {
            playRotation = playOrbit = false;
            setToggleStyle(document.getElementById('play-rotation'), false);
            setToggleStyle(document.getElementById('play-orbit'), false);
        };

        function updateRotationText() {
            let h = Math.floor(rotationHour);
            let m = Math.floor((rotationHour % 1) * 60);
            valRotation.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        }

        // --- 물리 및 기하 매핑 엔진 ---
        const earthPos = new THREE.Vector3(earthOrbitRadius, 0, 0); 
        const planetPos = new THREE.Vector3();

        function updatePhysics() {
            // 위도 각도 조절 적용
            humanGroup.rotation.x = THREE.MathUtils.degToRad(90 - observerLatitude);

            // 지구 자전 (무늬와 사람이 톱니바퀴처럼 동기화되어 회전)
            const rotRad = ((rotationHour - 12) / 24) * Math.PI * 2 - Math.PI / 2;
            earthMesh.rotation.y = rotRad;
            humanGroup.rotation.y = rotRad;

            // 시계 반대 방향 공전
            const planetRad = -THREE.MathUtils.degToRad(planetOrbitDeg);
            planetPos.set(Math.cos(planetRad) * planetOrbitRadius, 0, Math.sin(planetRad) * planetOrbitRadius);
            planetMesh.position.copy(planetPos);
            
            planetMesh.material.color.setHex(mode === 'inner' ? 0xeab308 : 0xef4444);

            calculateAspects();
            drawObserverSky(rotRad);
        }

        function calculateAspects() {
            const vEarthToSun = new THREE.Vector2(-earthPos.x, -earthPos.z).normalize();
            const vEarthToPlanet = new THREE.Vector2(planetPos.x - earthPos.x, planetPos.z - earthPos.z).normalize();
            
            let elongation = Math.acos(vEarthToSun.dot(vEarthToPlanet)); 
            let elongationDeg = THREE.MathUtils.radToDeg(elongation);

            const crossProd = vEarthToSun.x * vEarthToPlanet.y - vEarthToSun.y * vEarthToPlanet.x;
            const direction = crossProd < 0 ? "동방" : "서방";

            txtAngle.innerText = `${elongationDeg.toFixed(1)}°`;
            txtElongation.innerText = `${direction}이각`;

            const limit = 4.5; 

            if (mode === 'inner') {
                if (elongationDeg < limit) {
                    txtSpecial.innerText = (planetOrbitRadius < earthOrbitRadius) ? "내합 (Inferior)" : "외합 (Superior)";
                } else {
                    const maxElongationCalc = THREE.MathUtils.radToDeg(Math.asin(planetOrbitRadius / earthOrbitRadius));
                    if (Math.abs(elongationDeg - maxElongationCalc) < 2.5) txtSpecial.innerText = `${direction} 최대이각`;
                    else txtSpecial.innerText = "일반 위치";
                }
            } else {
                if (elongationDeg < limit) txtSpecial.innerText = "합 (Conjunction)";
                else if (elongationDeg > 180 - limit) txtSpecial.innerText = "충 (Opposition)";
                else if (Math.abs(elongationDeg - 90) < limit) txtSpecial.innerText = `${direction} 구 (Quadrature)`;
                else txtSpecial.innerText = "일반 위치";
            }
        }

        // --- 1인칭 스카이 렌더러 (동-남-서 배치) ---
        function drawObserverSky(rotRad) {
            const w = obsCanvas.width;
            const h = obsCanvas.height;
            obsCtx.clearRect(0, 0, w, h);

            let skyTone = 0;
            if (rotationHour >= 6 && rotationHour <= 18) {
                skyTone = 1 - Math.abs(rotationHour - 12) / 6;
            }
            obsCtx.fillStyle = `rgb(${Math.floor(10 * (1-skyTone))}, ${Math.floor(35 * skyTone + 5)}, ${Math.floor(75 * skyTone + 15)})`;
            obsCtx.fillRect(0, 0, w, h);

            const horizonY = h * 0.75;
            obsCtx.fillStyle = "#0f172a";
            obsCtx.fillRect(0, horizonY, w, h - horizonY);
            obsCtx.strokeStyle = "#334155";
            obsCtx.lineWidth = 2;
            obsCtx.beginPath(); obsCtx.moveTo(0, horizonY); obsCtx.lineTo(w, horizonY); obsCtx.stroke();

            // ★ 요청하신 동(E) - 남(S) - 서(W) 순서로 텍스트 배치
            obsCtx.fillStyle = "#94a3b8";
            obsCtx.font = "bold 11px sans-serif";
            obsCtx.fillText("동 (E)", w * 0.15, horizonY + 18);
            obsCtx.fillText("남 (S)", w * 0.5 - 10, horizonY + 18);
            obsCtx.fillText("서 (W)", w * 0.82, horizonY + 18);

            // 로컬 천구 좌표 계산 알고리즘
            const latRad = THREE.MathUtils.degToRad(observerLatitude);
            const baseZenith = new THREE.Vector3(0, Math.sin(latRad), Math.cos(latRad));
            const baseSouth = new THREE.Vector3(0, -Math.cos(latRad), Math.sin(latRad));
            const baseEast = new THREE.Vector3(1, 0, 0);

            const localZenith = baseZenith.clone().applyAxisAngle(new THREE.Vector3(0,1,0), rotRad).normalize();
            const localSouth = baseSouth.clone().applyAxisAngle(new THREE.Vector3(0,1,0), rotRad).normalize();
            const localEast = baseEast.clone().applyAxisAngle(new THREE.Vector3(0,1,0), rotRad).normalize();

            function projectTarget(targetPos, color, size, name) {
                const realObsPos = new THREE.Vector3().copy(earthPos).add(new THREE.Vector3().copy(localZenith).multiplyScalar(1.5));
                const relVec = new THREE.Vector3().subVectors(targetPos, realObsPos).normalize();

                const zenithDot = relVec.dot(localZenith);
                if (zenithDot < -0.01) return; 

                const southDot = relVec.dot(localSouth);
                const eastDot = relVec.dot(localEast);

                let azimuth = Math.atan2(eastDot, southDot); 
                
                // ★ 동(E)-남(S)-서(W) 투영: 왼쪽이 + (동), 오른쪽이 - (서)
                let screenX = (w / 2) - (azimuth / (Math.PI / 2)) * (w * 0.35);

                let altitude = Math.asin(zenithDot); 
                let screenY = horizonY - (altitude / (Math.PI / 2)) * (horizonY * 0.85);

                if (screenX >= 0 && screenX <= w) {
                    obsCtx.fillStyle = color;
                    obsCtx.beginPath();
                    obsCtx.arc(screenX, screenY, size, 0, Math.PI * 2);
                    obsCtx.fill();
                    
                    if(name === "태양") {
                        obsCtx.strokeStyle = "rgba(249,115,22,0.4)";
                        obsCtx.lineWidth = 6;
                        obsCtx.stroke();
                    }

                    obsCtx.fillStyle = "#ffffff";
                    obsCtx.font = "10px sans-serif";
                    obsCtx.fillText(name, screenX + size + 3, screenY + 3);
                }
            }

            projectTarget(new THREE.Vector3(0,0,0), "#ea580c", 7, "태양");
            projectTarget(planetPos, mode === 'inner' ? "#fbbf24" : "#f87171", 5, mode === 'inner' ? "금성" : "화성");
        }

        updatePhysics(); 

        function animate() {
            requestAnimationFrame(animate);
            let needUpdate = false;

            if (playRotation) {
                rotationHour = (rotationHour + 0.03) % 24;
                slideRotation.value = rotationHour;
                updateRotationText();
                needUpdate = true;
            }

            if (playOrbit) {
                planetOrbitDeg = (planetOrbitDeg + 0.5) % 360;
                slideOrbit.value = Math.floor(planetOrbitDeg);
                valOrbit.innerText = Math.floor(planetOrbitDeg);
                needUpdate = true;
            }

            if (needUpdate) updatePhysics();

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
