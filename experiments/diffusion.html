<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/arcadia.css">
    <title>비가역 현상 실험실 - 분자 확산</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --canvas-bg: #020617;
        }

        body {
            font-family: 'Gmarket Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            margin: 0;
            padding: 40px 0 56px;
            min-width: 320px;
        }

        h2 {
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        p.desc {
            color: var(--text-dim);
            margin-bottom: 30px;
            font-size: 14px;
        }

        canvas {
            background: var(--canvas-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: min(800px, calc(100% - 32px));
            height: auto;
        }

        .controls {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: min(740px, calc(100% - 32px));
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        label span {
            color: var(--accent-purple);
            font-weight: bold;
        }

        input[type=range] {
            appearance: none;
            background: #334155;
            height: 6px;
            border-radius: 10px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-purple);
            border-radius: 50%;
            cursor: pointer;
        }

        .control-actions {
            grid-column: span 2;
            display: flex;
            gap: 8px;
        }

        .control-actions button {
            flex: 1;
            padding: 14px;
            background-color: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .stats {
            margin-top: 15px;
            grid-column: span 2;
            font-size: 14px;
            color: var(--text-dim);
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .model-note {
            width: min(740px, calc(100% - 32px));
            margin-top: 14px;
            padding: 13px 15px;
            border-left: 3px solid var(--accent-purple);
            background: rgba(255,255,255,0.04);
            color: var(--text-dim);
            font-size: 13px;
            line-height: 1.65;
        }
        .model-note strong { color: var(--text-main); }

        @media (max-width: 620px) {
            body { padding-top: 78px; }
            h2 { font-size: 1.25rem; text-align: center; }
            p.desc { width: min(100% - 32px, 540px); text-align: center; line-height: 1.6; }
            .controls { padding: 20px; gap: 16px; }
            .control-actions { flex-direction: column; }
        }
    </style>
</head>

<body>
    <a href="../2d.html" style="position: fixed; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: rgba(30, 41, 59, 0.85); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; font-size: 14px; font-weight: 600; text-decoration: none; backdrop-filter: blur(8px); transition: 0.2s; z-index: 1000;" onmouseover="this.style.background='rgba(59, 130, 246, 0.9)'" onmouseout="this.style.background='rgba(30, 41, 59, 0.85)'">
      ← 실험 목록
    </a>

    <h2>기체 분자 확산</h2>
    <p class="desc">서로 다른 두 기체가 칸막이 제거 뒤 무작위 운동과 탄성 충돌을 거쳐 섞이는 과정을 관찰하세요.</p>

    <canvas id="gasCanvas" width="800" height="400"></canvas>

    <div class="controls">
        <div class="control-group">
            <label>분자 개수 <span id="countVal">100</span></label>
            <input type="range" id="count" min="20" max="300" value="100">
        </div>
        <div class="control-group">
            <label>상대 온도 <span id="tempVal">3</span></label>
            <input type="range" id="temp" min="1" max="10" step="0.5" value="3">
        </div>

        <div class="control-actions">
            <button onclick="startDiffusion()">칸막이 열기</button>
            <button id="pauseButton" onclick="togglePause()">일시정지</button>
            <button onclick="prepareSimulation()">초기화</button>
        </div>

        <div class="stats" id="stats">보라색과 하늘색 기체가 칸막이 양쪽에 준비되어 있습니다. 칸막이를 열어 확산을 시작하세요.</div>
    </div>

    <div class="model-note"><strong>이상 기체 모형의 가정</strong><br>분자는 무작위로 움직이며, 분자 사이의 인력·반발력은 충돌 순간을 제외하고 무시합니다. 같은 질량·크기의 입자가 충돌할 때는 완전 탄성 충돌로 근사하므로, 이 화면은 실제 기체의 확산 경향을 단순화해 보여 줍니다.</div>

    <script>
        const canvas = document.getElementById('gasCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let animId;
        let isReleased = false;
        let isPaused = true;

        class Particle {
            constructor(x, y, vX, vY, radius, species) {
                this.x = x;
                this.y = y;
                this.vX = vX;
                this.vY = vY;
                this.radius = radius;
                this.species = species;
            }

            draw() {
                const color = this.species === 'A' ? '#BA67F3' : '#60A5DF';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            update() {
                this.x += this.vX;
                this.y += this.vY;
                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                    this.vX *= -1;
                    this.x = this.x < this.radius ? this.radius : canvas.width - this.radius;
                }
                if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) {
                    this.vY *= -1;
                    this.y = this.y < this.radius ? this.radius : canvas.height - this.radius;
                }
                if (!isReleased && this.x + this.radius > canvas.width / 2) {
                    this.vX *= -1;
                    this.x = canvas.width / 2 - this.radius;
                }
            }
        }

        function createParticle(species, minX, maxX, temp) {
            const x = Math.random() * (maxX - minX) + minX;
            const y = Math.random() * (canvas.height - 20) + 10;
            const angle = Math.random() * Math.PI * 2;
            const speed = (Math.random() + 0.6) * Math.sqrt(temp / 3) * 2.2;
            return new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 3, species);
        }

        function prepareSimulation() {
            const count = parseInt(document.getElementById('count').value);
            const temp = parseFloat(document.getElementById('temp').value);
            const leftCount = Math.ceil(count / 2);
            const rightCount = count - leftCount;
            particles = [];
            for (let i = 0; i < leftCount; i++) particles.push(createParticle('A', 10, canvas.width / 2 - 10, temp));
            for (let i = 0; i < rightCount; i++) particles.push(createParticle('B', canvas.width / 2 + 10, canvas.width - 10, temp));
            isReleased = false;
            isPaused = true;
            document.getElementById('pauseButton').innerText = '일시정지';
            document.getElementById('stats').innerText = '보라색과 하늘색 기체가 칸막이 양쪽에 준비되어 있습니다. 칸막이를 열어 확산을 시작하세요.';
        }

        function startDiffusion() {
            isReleased = true;
            isPaused = false;
            document.getElementById('pauseButton').innerText = '일시정지';
            document.getElementById('stats').innerText = '확산 진행 중: 두 기체가 무작위 운동과 탄성 충돌을 하며 양쪽으로 섞입니다.';
        }

        function togglePause() {
            if (!isReleased) return;
            isPaused = !isPaused;
            document.getElementById('pauseButton').innerText = isPaused ? '다시 재생' : '일시정지';
            document.getElementById('stats').innerText = isPaused ? '일시정지됨: 현재 입자 분포를 관찰하세요.' : '확산을 다시 진행합니다.';
        }

        function resolveCollisions() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i], b = particles[j];
                    const dx = b.x - a.x, dy = b.y - a.y;
                    const distance = Math.hypot(dx, dy);
                    const minDistance = a.radius + b.radius;
                    if (distance === 0 || distance >= minDistance) continue;
                    const nx = dx / distance, ny = dy / distance;
                    const relativeNormalSpeed = (a.vX - b.vX) * nx + (a.vY - b.vY) * ny;
                    if (relativeNormalSpeed <= 0) continue;
                    a.vX -= relativeNormalSpeed * nx; a.vY -= relativeNormalSpeed * ny;
                    b.vX += relativeNormalSpeed * nx; b.vY += relativeNormalSpeed * ny;
                    const overlap = (minDistance - distance) / 2;
                    a.x -= nx * overlap; a.y -= ny * overlap;
                    b.x += nx * overlap; b.y += ny * overlap;
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.setLineDash(isReleased ? [] : [5, 5]);
            ctx.strokeStyle = isReleased ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            if (!isPaused) {
                particles.forEach(p => p.update());
                resolveCollisions();
            }
            particles.forEach(p => p.draw());
            animId = requestAnimationFrame(animate);
        }

        // UI 이벤트
        document.getElementById('count').addEventListener('input', (e) => document.getElementById('countVal').innerText = e.target.value);
        document.getElementById('temp').addEventListener('input', (e) => document.getElementById('tempVal').innerText = e.target.value);

        prepareSimulation();
        animate();
    </script>
</body>

</html>
