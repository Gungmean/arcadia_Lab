.bio-svg{--bio-text:#254a40;--bio-quiet:#507167;--bio-line:#699288;--bio-matrix:#d7e9d7;--bio-shell:#509b8c;--bio-rim:#b4ddcc;--bio-shadow:#34695f;--bio-protein:#c58f54;--bio-surface:#eef5e9;--bio-focus:#225c46;--bio-active:#f0c77f;--bio-dna:#6d8f9c;--bio-dot:#7ba39a;color:var(--bio-text)}
