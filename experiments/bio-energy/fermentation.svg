<svg xmlns="http://www.w3.org/2000/svg" class="bio-svg" viewBox="0 0 900 560" role="group" aria-label="세포질의 알코올발효: 해당과정, 탈탄산, NAD⁺ 재생"><title>세포질의 알코올발효: 해당과정, 탈탄산, NAD⁺ 재생</title><style>
.bio-svg{--bio-text:#254a40;--bio-quiet:#507167;--bio-line:#699288;--bio-matrix:#d7e9d7;--bio-shell:#509b8c;--bio-rim:#b4ddcc;--bio-shadow:#34695f;--bio-protein:#c58f54;--bio-surface:#eef5e9;--bio-focus:#225c46;--bio-active:#f0c77f;--bio-dna:#6d8f9c;--bio-dot:#7ba39a;color:var(--bio-text)}
[data-theme=dark] .bio-svg{--bio-text:#d7e8da;--bio-quiet:#9fbcb0;--bio-line:#6d9f93;--bio-matrix:#1d4038;--bio-shell:#396c62;--bio-rim:#77aa91;--bio-shadow:#0e2723;--bio-protein:#d7af71;--bio-surface:#16332c;--bio-focus:#c4eeb9;--bio-active:#efc67f;--bio-dna:#91c1c9;--bio-dot:#689e8d}
.bio-svg text{font-family:'Gmarket Sans','Malgun Gothic',sans-serif;fill:var(--bio-text);font-size:20px;letter-spacing:-.6px;paint-order:stroke;stroke:var(--bio-surface);stroke-width:2.5px;stroke-linejoin:round}.bio-svg .bio-small{font-size:15px;fill:var(--bio-quiet)}.bio-svg .bio-label{font-size:21px;font-weight:500;paint-order:stroke;stroke:var(--bio-surface);stroke-width:4px;stroke-linejoin:round}.bio-svg .bio-micro{font-size:13px;fill:var(--bio-text)}.bio-svg .bio-strong{font-weight:700;font-size:24px}.bio-svg .anatomy-region{cursor:pointer;outline:none}.bio-svg .region-outline{fill:none;stroke:transparent;stroke-width:3;transition:stroke .25s}.bio-svg .anatomy-region.is-active .region-outline,.bio-svg .anatomy-region:hover .region-outline,.bio-svg .anatomy-region:focus-visible .region-outline{stroke:var(--bio-focus)}.bio-svg .anatomy-region.is-active .active-fill{fill:var(--bio-active);opacity:.16}.bio-svg [data-flow]{fill:none;stroke:none;pointer-events:none}.bio-svg .leader{fill:none;stroke:var(--bio-line);stroke-width:1.25;stroke-linecap:round}.bio-svg .process-line{fill:none;stroke:var(--bio-protein);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.bio-svg .cycle-line{fill:none;stroke:var(--bio-focus);stroke-width:2;stroke-linecap:round}.bio-svg .membrane-line{fill:none;stroke:var(--bio-rim);stroke-width:3}.bio-svg .back-label{fill:var(--bio-quiet)}
</style><defs><linearGradient id="bio-envelope" x1="0" y1="0" x2="0.4" y2="1"><stop stop-color="var(--bio-rim)"/><stop offset=".5" stop-color="var(--bio-shell)"/><stop offset="1" stop-color="var(--bio-shadow)"/></linearGradient><linearGradient id="bio-matrix" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="var(--bio-surface)"/><stop offset="1" stop-color="var(--bio-matrix)"/></linearGradient><linearGradient id="bio-thylakoid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#92b47e"/><stop offset=".5" stop-color="#5e9366"/><stop offset="1" stop-color="#36664e"/></linearGradient><radialGradient id="bio-protein"><stop stop-color="#f3d7a4"/><stop offset="1" stop-color="#b9864d"/></radialGradient><filter id="bio-shadow" x="-40%" y="-70%" width="180%" height="250%"><feGaussianBlur stdDeviation="12"/></filter><marker id="bio-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--bio-focus)" stroke-width="1.5"/></marker><marker id="bio-amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--bio-protein)" stroke-width="1.5"/></marker></defs><ellipse cx="457" cy="414" rx="326" ry="26" fill="var(--bio-shadow)" opacity=".14" filter="url(#bio-shadow)"/><path d="M100 231C113 129 238 113 378 133C494 148 595 103 718 151C837 198 844 327 739 388C648 441 521 397 397 419C240 451 91 361 100 231Z" transform="translate(0 19)" fill="url(#bio-envelope)" stroke="var(--bio-shadow)" stroke-width="2"/><path d="M100 231C113 129 238 113 378 133C494 148 595 103 718 151C837 198 844 327 739 388C648 441 521 397 397 419C240 451 91 361 100 231Z" fill="url(#bio-matrix)" stroke="var(--bio-shell)" stroke-width="8"/><path d="M112 234C123 143 242 125 377 145C495 160 594 115 712 163C819 205 828 319 733 377" class="membrane-line"/>
<g transform="translate(147 241)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(171 330)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(227 187)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(312 166)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(353 342)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(419 396)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(473 167)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(534 365)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(628 159)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(709 200)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(766 300)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(686 370)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(203 367)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(587 198)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g><g transform="translate(374 203)" fill="var(--bio-dot)" opacity=".8"><ellipse rx="3.3" ry="2.5"/><ellipse cx="3" cy="3" rx="2.5" ry="2"/></g>
<g class="anatomy-region" data-stage="0" tabindex="0" role="button" aria-label="세포질 해당과정: 포도당 분해와 순생성 2 ATP"><path d="M176 216Q250 196 344 221L349 310Q275 333 175 306Z" class="active-fill" fill="var(--bio-matrix)" opacity=".3"/><path d="M165 210Q250 186 351 216L356 320Q269 345 164 312Z" class="region-outline"/><g transform="translate(201 251)"><circle cx="20" cy="0" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="10.000000000000002" cy="17.32050807568877" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="-9.999999999999996" cy="17.320508075688775" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="-20" cy="2.4492935982947065e-15" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="-10.000000000000009" cy="-17.32050807568877" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="10.000000000000002" cy="-17.32050807568877" r="8" fill="var(--bio-protein)" stroke="#a58053"/><text x="0" y="54" class="bio-label" text-anchor="middle">포도당</text><text x="0" y="77" class="bio-small" text-anchor="middle">6탄소 × 1</text></g><g transform="translate(376 251)"><circle cx="-24" cy="0" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="0" cy="0" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="24" cy="0" r="8" fill="var(--bio-protein)" stroke="#a58053"/><text x="0" y="54" class="bio-label" text-anchor="middle">피루브산</text><text x="0" y="77" class="bio-small" text-anchor="middle">3탄소 × 2</text></g><path d="M246 251H327" class="cycle-line" marker-end="url(#bio-arrow)"/><text x="281" y="231" class="bio-small" text-anchor="middle">해당과정</text><text x="280" y="347" class="bio-label" text-anchor="middle">순생성 2 ATP</text><path data-stage="0" data-flow="탄소" d="M180 251L232 251L330 251L400 251"/></g>
<g class="anatomy-region" data-stage="1" tabindex="0" role="button" aria-label="세포질: 피루브산 탈탄산으로 아세트알데하이드와 CO₂ 생성"><path class="region-outline" d="M425 210H584V330H425Z"/><path d="M425 252H506" class="cycle-line" marker-end="url(#bio-arrow)"/><g transform="translate(468 255) scale(0.7)"><path d="M-12 9Q-20-4-11-15Q-5-22 0-15Q9-22 14-12Q21 1 11 10Z" fill="url(#bio-protein)" stroke="#9c7144" stroke-width="1"/><path d="M-6-10Q0-3 7-11M-7 4Q0-1 8 3" fill="none" stroke="#e9c88e" stroke-width="1.3"/></g><g transform="translate(554 251)"><circle cx="-12" cy="0" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="12" cy="0" r="8" fill="var(--bio-protein)" stroke="#a58053"/><text x="0" y="54" class="bio-label" text-anchor="middle">아세트알데하이드</text><text x="0" y="77" class="bio-small" text-anchor="middle">2탄소 × 2</text></g><path d="M461 234Q474 193 508 181" class="process-line" marker-end="url(#bio-amber-arrow)"/><text x="516" y="177" class="bio-small" text-anchor="start">2 CO₂ 방출</text><path data-stage="1" data-flow="CO₂" d="M459 247Q463 203 504 181"/></g>
<g class="anatomy-region" data-stage="2" tabindex="0" role="button" aria-label="세포질: NADH가 전자를 전달하여 NAD⁺를 재생"><path class="region-outline" d="M590 205H773V330H590Z"/><path d="M598 251H674" class="cycle-line" marker-end="url(#bio-arrow)"/><g transform="translate(638 255) scale(0.7)"><path d="M-12 9Q-20-4-11-15Q-5-22 0-15Q9-22 14-12Q21 1 11 10Z" fill="url(#bio-protein)" stroke="#9c7144" stroke-width="1"/><path d="M-6-10Q0-3 7-11M-7 4Q0-1 8 3" fill="none" stroke="#e9c88e" stroke-width="1.3"/></g><g transform="translate(723 251)"><circle cx="-12" cy="0" r="8" fill="var(--bio-protein)" stroke="#a58053"/><circle cx="12" cy="0" r="8" fill="var(--bio-protein)" stroke="#a58053"/><text x="0" y="54" class="bio-label" text-anchor="middle">에탄올</text><text x="0" y="77" class="bio-small" text-anchor="middle">2탄소 × 2</text></g><text x="635" y="219" class="bio-small" text-anchor="middle">NADH → NAD⁺</text><path data-stage="2" data-flow="전자" d="M594 251L742 251"/><path data-stage="2" data-flow="NAD⁺" d="M666 319C639 400 329 401 278 308"/></g>
<path d="M650 325C598 402 329 392 280 312" class="cycle-line" marker-end="url(#bio-arrow)"/><text x="474" y="384" class="bio-small" text-anchor="middle">NAD⁺ 재생 → 해당과정 지속</text><text x="126" y="105" class="bio-label" text-anchor="start">세포질 확대</text><text x="743" y="130" class="bio-small" text-anchor="start">세포막</text><path d="M758 137 771 175" class="leader"/><text x="457" y="474" class="bio-small" text-anchor="middle">CO₂는 탈탄산 단계에서 · 추가 ATP 생성 없음</text><text x="450" y="530" class="bio-small" text-anchor="middle">교육용 절개도 · 구조와 분자의 상대 크기는 실제 축척이 아닙니다.</text></svg>