<!-- ========================= -->
<!-- 2D 실험실 (2d.html) -->
<!-- ========================= -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D 실험실</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI', sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      overflow-x:hidden;
    }

    .bg{
      position:fixed;
      width:100%;
      height:100%;
      background:
      radial-gradient(circle at top left,#1e293b 0%,transparent 35%),
      radial-gradient(circle at bottom right,#2563eb 0%,transparent 30%);
      z-index:-1;
    }

    .container{
      width:90%;
      max-width:1200px;
      margin:auto;
      padding:60px 0;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:50px;
    }

    .title{
      font-size:3rem;
      font-weight:700;
    }

    .back{
      padding:12px 20px;
      border:none;
      border-radius:14px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      transition:0.2s;
    }

    .back:hover{
      background:#3b82f6;
    }

    .subtitle{
      color:#cbd5e1;
      margin-bottom:40px;
      font-size:1rem;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:25px;
    }

    .card{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px;
      padding:35px 25px;
      backdrop-filter:blur(10px);
      transition:0.25s;
      cursor:pointer;
    }

    .card:hover{
      transform:translateY(-6px);
      border-color:#3b82f6;
      box-shadow:0 0 25px rgba(59,130,246,0.25);
    }

    .icon{
      font-size:3rem;
      margin-bottom:18px;
    }

    .card h2{
      margin-bottom:10px;
      font-size:1.5rem;
    }

    .card p{
      color:#cbd5e1;
      line-height:1.5;
      font-size:0.95rem;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <div class="topbar">
    <div class="title">2D 실험실</div>

    <button class="back" onclick="location.href='index.html'">
      뒤로가기
    </button>
  </div>

  <div class="subtitle">
    원하는 실험을 선택하세요
  </div>

  <div class="grid">

    <!-- 전기 회로 -->
    <div class="card" onclick="location.href='experiments/circuit.html'">
      <div class="icon">⚡</div>
      <h2>전기 회로</h2>
      <p>직렬·병렬 회로와 전류 흐름 실험</p>
    </div>

    <!-- 자기장 -->
    <div class="card" onclick="location.href='experiments/magnet.html'">
      <div class="icon">🧲</div>
      <h2>자기장</h2>
      <p>자석과 자기력 상호작용 관찰</p>
    </div>

    <!-- 파동 실험 -->
    <div class="card" onclick="location.href='experiments/wave.html'">
      <div class="icon">🌊</div>
      <h2>파동 실험</h2>
      <p>진동과 파동의 움직임 분석</p>
    </div>

    <!-- 빛의 반사 -->
    <div class="card" onclick="location.href='experiments/reflection.html'">
      <div class="icon">☀️</div>
      <h2>빛의 반사</h2>
      <p>거울과 빛의 반사각 확인</p>
    </div>

  </div>
</div>

</body>
</html>
